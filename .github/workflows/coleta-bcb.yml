name: Coleta BCB diária

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC = 02:00 BRT (madrugada no Brasil)
  workflow_dispatch:          # botão de execução manual na aba Actions

# Necessário para o workflow escrever de volta no repositório (commit dos dados).
permissions:
  contents: write

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # trava de segurança contra travamento do job

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coleta
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}   # opcional; se vazio, envia para EMAIL_USER
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python coleta_bcb.py

      - name: Commitar CSVs e PNGs atualizados
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/*.csv dados/*.png dados/estado_alertas.json
          # só commita se algo mudou (evita commit vazio quando não há dado novo)
          git diff --staged --quiet || git commit -m "dados: atualização automática BCB $(date +%F)"
          git push